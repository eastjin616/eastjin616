name: Update latest blog posts

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/blog-posts.yml
      - .github/scripts/update_blog.py
      - .github/scripts/test_update_blog.py

permissions:
  contents: write

concurrency:
  group: profile-blog-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test blog updater
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Fetch latest Tistory posts
        run: python3 .github/scripts/update_blog.py
      - name: Commit changed post list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update latest Tistory blog posts"
          git pull --rebase origin main
          git push origin HEAD:main
